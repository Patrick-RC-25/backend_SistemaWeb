[project]
name = "backend"
version = "0.1.0"
description = "CarlitoApp — SQL Server + Argon2id + JWT (sin ORM)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.0",
    "pyjwt>=2.15.1",
    "pyodbc>=5.5.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
